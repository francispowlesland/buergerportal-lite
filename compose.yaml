services:
  db:
    image: docker.io/library/postgres:17-alpine
    container_name: buergerportal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: buergerportal
      POSTGRES_PASSWORD: buergerportal
      POSTGRES_DB: buergerportal
      TZ: Europe/Berlin
    ports:
      - '5433:5432'
    volumes:
      - buergerportal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U buergerportal -d buergerportal']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  buergerportal-pgdata:
