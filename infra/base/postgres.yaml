apiVersion: v1
kind: Service
metadata:
  name: buergerportal-db
  labels:
    app.kubernetes.io/name: buergerportal-db
    app.kubernetes.io/part-of: buergerportal
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: buergerportal-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buergerportal-db
  labels:
    app.kubernetes.io/name: buergerportal-db
    app.kubernetes.io/part-of: buergerportal
spec:
  serviceName: buergerportal-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buergerportal-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buergerportal-db
        app.kubernetes.io/part-of: buergerportal
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:1
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: buergerportal-db-secret
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buergerportal-db-secret
                  key: database-password
            - name: POSTGRESQL_DATABASE
              value: 'buergerportal'
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - /usr/libexec/check-container
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /usr/libexec/check-container
                - --live
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
