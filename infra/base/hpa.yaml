apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: buergerportal
  labels:
    app.kubernetes.io/name: buergerportal
    app.kubernetes.io/part-of: buergerportal
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: buergerportal
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
